<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchTube</title>
    <link rel="stylesheet" type="text/css" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <section class="popup-card">
        <div class="popup-head">
          <p class="popup-eyebrow">WatchTube</p>
          <h1 class="popup-title">Homepage Settings</h1>
          <p class="popup-subtitle">
            Keep YouTube's short-form feed out of the way.
          </p>
        </div>

        <div class="settings-group">
          <label class="toggle-row" for="enabled">
            <div class="toggle-copy">
              <span class="toggle-label">WatchTube</span>
              <span id="enabledState" class="toggle-state"> On </span>
            </div>

            <span class="switch">
              <input id="enabled" type="checkbox" />
              <span class="slider"></span>
            </span>
          </label>

          <label class="toggle-row" for="hideShorts">
            <div class="toggle-copy">
              <span class="toggle-label">Hide Shorts</span>
              <span id="hideShortsState" class="toggle-state"> Disabled </span>
            </div>

            <span class="switch">
              <input id="hideShorts" type="checkbox" />
              <span class="slider"></span>
            </span>
          </label>
        </div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
